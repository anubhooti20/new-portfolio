name: Deploy Portfolio to VM

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi

            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing backend dependencies ==="
            /home/deploy/.virtualenvs/portfolio-env/bin/pip install -r backend/requirements.txt

            echo "=== Seeding database if empty ==="
            cd ${{ secrets.DEPLOY_PATH }}/backend
            /home/deploy/.virtualenvs/portfolio-env/bin/python seed.py

            echo "=== Installing frontend dependencies ==="
            cd ${{ secrets.DEPLOY_PATH }}/frontend
            npm ci

            echo "=== Building frontend ==="
            npm run build

            echo "=== Restarting PM2 ==="
            pm2 delete portfolio-backend >/dev/null 2>&1 || true
            pm2 start "/home/deploy/.virtualenvs/portfolio-env/bin/uvicorn main:app --host 0.0.0.0 --port 8000" \
              --name portfolio-backend \
              --interpreter none \
              --cwd ${{ secrets.DEPLOY_PATH }}/backend

            if pm2 describe portfolio-frontend >/dev/null 2>&1; then
              pm2 restart portfolio-frontend --update-env
            else
              pm2 start npm --name portfolio-frontend -- start
            fi

            pm2 save
            pm2 list
